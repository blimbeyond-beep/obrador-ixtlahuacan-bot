services:
  - type: web
    name: obrador-ixtlahuacan-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: WHAPI_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PHONE
        value: 5213312974282@s.whatsapp.net
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_HISTORY
        value: "24"
      - key: PYTHON_VERSION
        value: "3.13.5"
